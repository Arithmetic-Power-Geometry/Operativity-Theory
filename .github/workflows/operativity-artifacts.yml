name: Operativity exact benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r requirements.txt

      - name: Test
        run: python -m pytest -q

      - name: Generate exact artifacts
        run: python -m src.run_experiments

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: operativity-results
          path: artifacts/
          if-no-files-found: error

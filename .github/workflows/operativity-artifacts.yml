name: Operativity exact benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Test
        run: python -m pytest -q
      - name: Generate canonical cases
        run: python -m src.run_experiments
      - name: Exhaust finite 2-bit verifier systems
        run: python -m src.exhaustive
      - name: Test generated-verifier semantic quotient
        run: python -m src.generated_verifiers

      - name: Run APS scalability benchmark
        run: python -m src.scalability

      - name: Run realistic transformation scenarios
        run: python -m src.realistic_scenarios

      - name: Compare APS with conventional product reachability
        run: python -m src.baseline_comparison

      - name: Run specification-economy pilot
        run: python -m src.specification_economy

      - name: Run certification-to-measurement bridge
        run: python -m src.run_measurement_bridge

      - name: Run automatic observation synthesis
        run: python -m src.run_observation_synthesis

      - name: Run causal observation synthesis
        run: python -m src.run_causal_observation_synthesis

      - name: Run external causal transfer cases
        run: python -m src.run_external_causal_cases

      - name: Run causal diagnostic baseline comparison
        run: python -m src.run_causal_baseline_comparison

      - name: Run externalized-label evaluation
        run: python -m src.run_external_label_evaluation

      - name: Run blind-source diagnostic evaluation
        run: python -m src.run_blind_label_evaluation

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: operativity-results
          path: artifacts/
          if-no-files-found: error

